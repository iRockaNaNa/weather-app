name: weather_app
description: "Weather App — discover the weather in your city and plan your day correctly."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  geolocator: ^14.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.6

  material_ui: ^1.11.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  home_widget: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
